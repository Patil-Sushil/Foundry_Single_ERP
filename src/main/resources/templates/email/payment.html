<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout/email-layout :: layout(~{::content})}">
<body>
    <div th:fragment="content">
        <h2>Dear <span th:text="${customerName}">Customer</span>,</h2>
        <p>This is to confirm that we have successfully received your payment of <strong><span th:text="${paymentAmount}">₹0.00</span></strong>.</p>
        
        <div class="summary-box">
            <div class="summary-item">
                <span class="summary-label">Payment Date:</span>
                <span th:text="${paymentDate}">2026-04-17</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Payment Mode:</span>
                <span th:text="${paymentMode}">NEFT/RTGS</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Reference Number:</span>
                <span th:text="${referenceNumber}">N12345678</span>
            </div>
        </div>

        <p>Thank you for your business!</p>
        
        <p>Best Regards,<br>
        <span th:text="${companyName}">Company Name</span></p>
    </div>
</body>
</html>
