server:
  port: 8080

spring:
  application:
    name: FoundryApplication

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://192.168.11.41:5432/foundry_dev_db?useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:devuser}
    password: ${SPRING_DATASOURCE_PASSWORD:devpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: Q0tQeXJmOW9Jb2ZxV2F5cFhUeG5sQzFkQkZpQzZ3c0ZxS0p4cA==
  expiration: 900000
  refresh-expiration: 604800000


app:
  default-admin:
    email: admin@foundry.com
    password: Admin@123

