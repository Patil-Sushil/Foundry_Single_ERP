server:
  port: ${PORT:8080}

spring:
  application:
    name: FoundryApplication

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show-sql: false
        format_sql: false

  flyway:
    enabled: true
    baselineOnMigrate: true
    locations: classpath:db/migration/public

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_USERMAIL}
    password: ${SPRING_USERPASS}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: ${JWT_EXP_TIME}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false